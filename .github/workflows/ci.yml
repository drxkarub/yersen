name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      # Testler CI'da arada bir takılıyor (yerelde 2 çekirdekle tekrarlanamadı). Takılırsa 15 dk
      # beklemek yerine 5 dk'da kesilip bir kez yeniden denenir; hanging-process neyin açık kaldığını yazar.
      - name: Testler
        run: |
          for attempt in 1 2; do
            timeout --kill-after=10s 300 npx vitest run --reporter=default --reporter=hanging-process && exit 0
            echo "::warning::Testler $attempt. denemede geçmedi ya da takıldı (çıkış $?)"
          done
          exit 1

      - name: Derleme
        run: npm run build

  # main'e push'ta, kontroller geçerse imaj GHCR'ye gönderilir.
  # Sunucudaki watchtower :latest etiketini en geç 60 sn içinde çeker. Repoda sunucuya ait gizli bilgi yoktur.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: İmaj adı
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
