<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --lacivert: #112a79; --lacivert-koyu: #0d1a4a; --altin: #cb9832;
    --zemin: #f3f5fa; --fis: #ffffff; --iptal: #c2382c; --soluk: #6b7392;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 390px; height: 844px; background: var(--zemin); font-family: "Titillium Web", system-ui, sans-serif; color: var(--lacivert-koyu); display: flex; flex-direction: column; }
  header { background: var(--lacivert); color: #fff; padding: 14px 18px 12px; border-bottom: 4px solid var(--altin); display: flex; justify-content: space-between; align-items: baseline; }
  .wordmark { font-weight: 900; font-size: 26px; letter-spacing: -0.5px; }
  .date { font-size: 15px; opacity: .85; }
  main { flex: 1; padding: 18px 14px 0; }
  .fis { background: var(--fis); border-radius: 6px; position: relative; padding: 16px 18px 14px; box-shadow: 0 1px 0 #d7dcea; }
  .fis::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 54px; border-top: 2px dashed #cfd5e6; }
  .fis-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .fis-title { font-size: 30px; font-weight: 700; line-height: 1; }
  .fis-no { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--soluk); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 11px 0; border-top: 1px solid #e6e9f2; }
  .dish { font-size: 19px; font-weight: 600; }
  .score { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 30px; color: var(--lacivert); text-align: right; line-height: 1; }
  .votes { grid-column: 1 / -1; font-size: 13px; color: var(--soluk); margin-top: -4px; }
  .score.az { font-size: 22px; color: #9aa2bf; }
  .stamp { position: absolute; right: 22px; top: 58px; width: 92px; height: 92px; border: 4px solid var(--altin); border-radius: 50%; color: var(--altin); transform: rotate(-12deg); display: grid; place-items: center; text-align: center; font-weight: 900; line-height: .9; opacity: .92; }
  .stamp b { font-size: 34px; display: block; }
  .stamp small { font-size: 11px; font-weight: 700; }
  .kcal { padding-top: 22px; display: flex; justify-content: space-between; font-size: 14px; color: var(--soluk); }
  .action { padding: 14px; }
  .btn { width: 100%; height: 58px; border: 0; border-radius: 6px; background: var(--altin); color: var(--lacivert-koyu); font: 700 22px "Titillium Web", sans-serif; }
  nav { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; border-top: 1px solid #dfe3ee; height: 68px; }
  nav a { display: grid; place-items: center; font-size: 15px; font-weight: 600; color: var(--soluk); text-decoration: none; }
  nav a.on { color: var(--lacivert); box-shadow: inset 0 3px 0 var(--altin); }
</style>
</head>
<body>
  <header><span class="wordmark">yersen</span><span class="date">Pazartesi, 16 Kasım</span></header>
  <main>
    <section class="fis">
      <div class="fis-head"><h1 class="fis-title">Bugünün fişi</h1><span class="fis-no">No 0316</span></div>
      <div class="stamp"><div><b>7.4</b><small>ORTALAMA</small></div></div>
      <div class="row"><span class="dish">Düğün çorbası</span><span class="score">8.1</span><span class="votes">42 kişi puanladı</span></div>
      <div class="row"><span class="dish">Etli nohut</span><span class="score">7.6</span><span class="votes">39 kişi puanladı</span></div>
      <div class="row"><span class="dish">Pirinç pilavı</span><span class="score">6.9</span><span class="votes">35 kişi puanladı</span></div>
      <div class="row"><span class="dish">Yoğurt</span><span class="score az">5.0</span><span class="votes">3 kişi puanladı</span></div>
      <div class="kcal"><span>916 kcal, günün toplamı</span><span>Örnek veri</span></div>
    </section>
  </main>
  <div class="action"><button class="btn">Yedim, puanla</button></div>
  <nav><a class="on">Bugün</a><a>Kaydır</a><a>Ben</a></nav>
</body>
</html>
