# Üretim. Sunucuda /opt/yersen altında çalışır; gizli değerler .env dosyasından gelir.
# Kurallar (bkz. CLAUDE.md): portlar yalnızca 127.0.0.1'e, Postgres hiç port yayınlamaz,
# bellek sınırları sabit. API imajını watchtower CI'dan gelen :latest ile günceller; Postgres'e dokunmaz.
name: yersen

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: yersen
      POSTGRES_USER: yersen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yersen -d yersen"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  api:
    # CI her main push'unda bu etiketi günceller; watchtower en geç 60 sn içinde çeker.
    # Sorunlu sürümde geri dönmek: API_IMAGE=ghcr.io/drxkarub/yersen:<eski sha> docker compose up -d api
    image: ${API_IMAGE:-ghcr.io/drxkarub/yersen:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yersen:${POSTGRES_PASSWORD}@db:5432/yersen
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3300:3300"
    mem_limit: 192m
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Sürekli çalışmaz: sunucudaki systemd timer günde iki kez çalıştırır (07:00 ve 10:00 İstanbul).
  #   docker compose run --rm scraper
  scraper:
    image: ${API_IMAGE:-ghcr.io/drxkarub/yersen:latest}
    profiles: ["tools"]
    working_dir: /app/scraper
    command: ["node", "--import", "tsx", "src/index.ts"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yersen:${POSTGRES_PASSWORD}@db:5432/yersen
      HEALTHCHECKS_SCRAPER_URL: ${HEALTHCHECKS_SCRAPER_URL:-}
    mem_limit: 128m
    restart: "no"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  db-data:
